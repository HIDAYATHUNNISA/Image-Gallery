<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery with Lightbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <div class="container my-5">
    <h2 class="text-center mb-4">Image Gallery</h2>
    <div class="row g-3">
      <!-- Image Thumbnails -->
      <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img1.jpg" class="img-fluid gallery-img" alt="Gallery Image 1">
      </div>
      <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img2.jpg" class="img-fluid gallery-img" alt="Gallery Image 2">
      </div>
      <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img3.jpg" class="img-fluid gallery-img" alt="Gallery Image 3">
      </div>
     <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img4.jpg" class="img-fluid gallery-img" alt="Gallery Image 4">
      </div>
      <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img5.jpg" class="img-fluid gallery-img" alt="Gallery Image 5">
      </div>
      <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img6.jpg" class="img-fluid gallery-img" alt="Gallery Image 6">
      </div>
        <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img7.jpg" class="img-fluid gallery-img" alt="Gallery Image 7">
      </div> 
       <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img8.jpg" class="img-fluid gallery-img" alt="Gallery Image 8">
      </div>  
      <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img9.jpg" class="img-fluid gallery-img" alt="Gallery Image 9">
      </div>
       <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img10.jpg" class="img-fluid gallery-img" alt="Gallery Image 10">
      </div>
       <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img11.jpg" class="img-fluid gallery-img" alt="Gallery Image 11">
      </div>
       <div class="col-sm-6 col-md-4 col-lg-3">
        <img src="images/img12.jpg" class="img-fluid gallery-img" alt="Gallery Image 12">
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox d-none">
    <span class="close-btn">&times;</span>
    <img class="lightbox-img" src="" alt="">
    <a class="prev">&#10094;</a>
    <a class="next">&#10095;</a>
  </div>

  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
